<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux → Real</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjMGIwZjFhIi8+CjxwYXRoIGQ9Ik0zMiAxMCBMNTAgMzIgTDMyIDU0IEwxNCAzMiBaIiBmaWxsPSIjMmZkNDgwIi8+CjxwYXRoIGQ9Ik0zMiAxMCBMNTAgMzIgTDMyIDU0IFoiIGZpbGw9IiM0YzhkZmYiLz4KPC9zdmc+Cg==">
<style>
  :root {
    --bg: #0b0f1a;
    --card: #131a2b;
    --card-border: #1f2a42;
    --text: #eef1f8;
    --text-dim: #7c88a6;
    --devex: #2fd480;
    --devex-bg: #0f2a1e;
    --devex-border: #1c4a34;
    --mercado: #4c8dff;
    --mercado-bg: #0f1f3d;
    --mercado-border: #1e3968;
    --toggle-bg: #0d1424;
    --toggle-active: #232f4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--text-dim); font-weight: 400; }
  .toggle {
    display: flex;
    background: var(--toggle-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 20px;
  }
  .toggle button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .toggle button.active {
    background: var(--toggle-active);
    color: var(--text);
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: #0d1424;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-size: 24px;
    font-weight: 600;
    padding: 14px 16px;
    outline: none;
  }
  input:focus { border-color: #35447a; }
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 24px;
  }
  .result {
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .result.devex { background: var(--devex-bg); border: 1px solid var(--devex-border); }
  .result.mercado { background: var(--mercado-bg); border: 1px solid var(--mercado-border); }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .devex .tag { background: var(--devex); color: #06180f; }
  .mercado .tag { background: var(--mercado); color: #06122c; }
  .value {
    font-size: 20px;
    font-weight: 700;
  }
  .devex .value { color: var(--devex); }
  .mercado .value { color: var(--mercado); }
  .sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .footer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Robux <span>⇄</span> Real</h1>

  <div class="toggle">
    <button id="btnR2B" class="active">Robux → Real</button>
    <button id="btnB2R">Real → Robux</button>
  </div>

  <label id="inputLabel" for="amount">Quantidade de Robux</label>
  <input id="amount" type="number" min="0" value="1000" inputmode="decimal">

  <div class="results">
    <div class="result devex">
      <div class="tag">DEVEX</div>
      <div class="value" id="valDevex">R$ 0,00</div>
      <div class="sub">Retirada de desenvolvedor</div>
    </div>
    <div class="result mercado">
      <div class="tag">MERCADO</div>
      <div class="value" id="valMercado">R$ 0,00</div>
      <div class="sub">Preço de compra</div>
    </div>
  </div>

  <div class="footer">1 Robux = $0,0038 (DevEx) · $0,0125 (Mercado) · $1 = R$5,15</div>
</div>

<script>
  const RATE_DEVEX = 0.0038;
  const RATE_MERCADO = 0.0125;
  const USD_BRL = 5.15;

  let mode = 'r2b';

  const amount = document.getElementById('amount');
  const inputLabel = document.getElementById('inputLabel');
  const valDevex = document.getElementById('valDevex');
  const valMercado = document.getElementById('valMercado');
  const btnR2B = document.getElementById('btnR2B');
  const btnB2R = document.getElementById('btnB2R');

  function formatBRL(v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }
  function formatRobux(v) {
    return Math.round(v).toLocaleString('pt-BR') + ' Robux';
  }

  function setMode(m) {
    mode = m;
    btnR2B.classList.toggle('active', m === 'r2b');
    btnB2R.classList.toggle('active', m === 'b2r');
    inputLabel.textContent = m === 'r2b' ? 'Quantidade de Robux' : 'Valor em Reais (R$)';
    calc();
  }

  function calc() {
    const v = parseFloat(amount.value) || 0;

    if (mode === 'r2b') {
      valDevex.textContent = formatBRL(v * RATE_DEVEX * USD_BRL);
      valMercado.textContent = formatBRL(v * RATE_MERCADO * USD_BRL);
    } else {
      const usd = v / USD_BRL;
      valDevex.textContent = formatRobux(usd / RATE_DEVEX);
      valMercado.textContent = formatRobux(usd / RATE_MERCADO);
    }
  }

  btnR2B.addEventListener('click', () => setMode('r2b'));
  btnB2R.addEventListener('click', () => setMode('b2r'));
  amount.addEventListener('input', calc);

  setMode('r2b');
</script>

</body>
</html>
