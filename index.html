<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux → Real</title>
<style>
  :root {
    --bg: #0b0f1a;
    --card: #131a2b;
    --card-border: #1f2a42;
    --text: #eef1f8;
    --text-dim: #7c88a6;
    --devex: #2fd480;
    --devex-bg: #0f2a1e;
    --devex-border: #1c4a34;
    --mercado: #4c8dff;
    --mercado-bg: #0f1f3d;
    --mercado-border: #1e3968;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 24px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--text-dim); font-weight: 400; }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: #0d1424;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-size: 24px;
    font-weight: 600;
    padding: 14px 16px;
    outline: none;
  }
  input:focus { border-color: #35447a; }
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 24px;
  }
  .result {
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .result.devex { background: var(--devex-bg); border: 1px solid var(--devex-border); }
  .result.mercado { background: var(--mercado-bg); border: 1px solid var(--mercado-border); }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .devex .tag { background: var(--devex); color: #06180f; }
  .mercado .tag { background: var(--mercado); color: #06122c; }
  .value {
    font-size: 22px;
    font-weight: 700;
  }
  .devex .value { color: var(--devex); }
  .mercado .value { color: var(--mercado); }
  .sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .footer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Robux <span>→</span> Real</h1>

  <label for="robux">Quantidade de Robux</label>
  <input id="robux" type="number" min="0" value="1000" inputmode="numeric">

  <div class="results">
    <div class="result devex">
      <div class="tag">DEVEX</div>
      <div class="value" id="valDevex">R$ 0,00</div>
      <div class="sub">Retirada de desenvolvedor</div>
    </div>
    <div class="result mercado">
      <div class="tag">MERCADO</div>
      <div class="value" id="valMercado">R$ 0,00</div>
      <div class="sub">Preço de compra</div>
    </div>
  </div>

  <div class="footer">1 Robux = $0,0038 (DevEx) · $0,0125 (Mercado) · $1 = R$5,15</div>
</div>

<script>
  const RATE_DEVEX = 0.0038;
  const RATE_MERCADO = 0.0125;
  const USD_BRL = 5.15;

  const input = document.getElementById('robux');
  const valDevex = document.getElementById('valDevex');
  const valMercado = document.getElementById('valMercado');

  function formatBRL(v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function calc() {
    const robux = parseFloat(input.value) || 0;
    valDevex.textContent = formatBRL(robux * RATE_DEVEX * USD_BRL);
    valMercado.textContent = formatBRL(robux * RATE_MERCADO * USD_BRL);
  }

  input.addEventListener('input', calc);
  calc();
</script>

</body>
</html>
