<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux → Real</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjMGIwZjFhIi8+CjxwYXRoIGQ9Ik0zMiAxMCBMNTAgMzIgTDMyIDU0IEwxNCAzMiBaIiBmaWxsPSIjMmZkNDgwIi8+CjxwYXRoIGQ9Ik0zMiAxMCBMNTAgMzIgTDMyIDU0IFoiIGZpbGw9IiM0YzhkZmYiLz4KPC9zdmc+Cg==">
<style>
  :root {
    --bg: #0b0f1a;
    --card: #131a2b;
    --card-border: #1f2a42;
    --text: #eef1f8;
    --text-dim: #7c88a6;
    --devex: #2fd480;
    --devex-bg: #0f2a1e;
    --devex-border: #1c4a34;
    --mercado: #4c8dff;
    --mercado-bg: #0f1f3d;
    --mercado-border: #1e3968;
    --toggle-bg: #0d1424;
    --toggle-active: #232f4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--text-dim); font-weight: 400; }
  .toggle {
    display: flex;
    background: var(--toggle-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 16px;
  }
  .toggle button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .toggle button.active {
    background: var(--toggle-active);
    color: var(--text);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  input, select {
    width: 100%;
    background: #0d1424;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  input {
    font-size: 24px;
    font-weight: 600;
    padding: 14px 16px;
  }
  input:focus, select:focus { border-color: #35447a; }
  select {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 32px 10px 14px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0' fill='none' stroke='%237c88a6' stroke-width='1.5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  .result {
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .result.devex { background: var(--devex-bg); border: 1px solid var(--devex-border); }
  .result.mercado { background: var(--mercado-bg); border: 1px solid var(--mercado-border); }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .devex .tag { background: var(--devex); color: #06180f; }
  .mercado .tag { background: var(--mercado); color: #06122c; }
  .value {
    font-size: 19px;
    font-weight: 700;
  }
  .devex .value { color: var(--devex); }
  .mercado .value { color: var(--mercado); }
  .sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .footer {
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Robux <span>⇄</span> Dinheiro</h1>

  <div class="toggle">
    <button id="btnR2M" class="active">Robux → Dinheiro</button>
    <button id="btnM2R">Dinheiro → Robux</button>
  </div>

  <label for="currency">Moeda</label>
  <select id="currency">
    <option value="BRL" selected>Real (BRL)</option>
    <option value="USD">Dólar (USD)</option>
  </select>

  <div style="height:16px"></div>

  <label id="inputLabel" for="amount">Quantidade de Robux</label>
  <input id="amount" type="number" min="0" value="1000" inputmode="decimal">

  <div class="results">
    <div class="result devex">
      <div class="tag">DEVEX</div>
      <div class="value" id="valDevex">R$ 0,00</div>
      <div class="sub">Retirada de desenvolvedor</div>
    </div>
    <div class="result mercado">
      <div class="tag">MERCADO</div>
      <div class="value" id="valMercado">R$ 0,00</div>
      <div class="sub">Preço de compra</div>
    </div>
  </div>

  <div class="footer">1 Robux = $0,0038 (DevEx) · $0,0125 (Mercado) · $1 = R$5,15</div>
</div>

<script>
  const RATE_DEVEX = 0.0038;
  const RATE_MERCADO = 0.0125;
  const USD_BRL = 5.15;

  let mode = 'r2m';

  const amount = document.getElementById('amount');
  const inputLabel = document.getElementById('inputLabel');
  const currency = document.getElementById('currency');
  const valDevex = document.getElementById('valDevex');
  const valMercado = document.getElementById('valMercado');
  const btnR2M = document.getElementById('btnR2M');
  const btnM2R = document.getElementById('btnM2R');

  function formatMoney(v, cur) {
    if (cur === 'BRL') {
      return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }
    return v.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
  }
  function formatRobux(v) {
    return Math.round(v).toLocaleString('pt-BR') + ' Robux';
  }

  function updateLabel() {
    if (mode === 'r2m') {
      inputLabel.textContent = 'Quantidade de Robux';
    } else {
      inputLabel.textContent = currency.value === 'BRL' ? 'Valor em Reais (R$)' : 'Valor em Dólares (US$)';
    }
  }

  function setMode(m) {
    mode = m;
    btnR2M.classList.toggle('active', m === 'r2m');
    btnM2R.classList.toggle('active', m === 'm2r');
    updateLabel();
    calc();
  }

  function calc() {
    const v = parseFloat(amount.value) || 0;
    const cur = currency.value;

    if (mode === 'r2m') {
      const usdDevex = v * RATE_DEVEX;
      const usdMercado = v * RATE_MERCADO;
      if (cur === 'BRL') {
        valDevex.textContent = formatMoney(usdDevex * USD_BRL, 'BRL');
        valMercado.textContent = formatMoney(usdMercado * USD_BRL, 'BRL');
      } else {
        valDevex.textContent = formatMoney(usdDevex, 'USD');
        valMercado.textContent = formatMoney(usdMercado, 'USD');
      }
    } else {
      const usdValue = cur === 'BRL' ? v / USD_BRL : v;
      valDevex.textContent = formatRobux(usdValue / RATE_DEVEX);
      valMercado.textContent = formatRobux(usdValue / RATE_MERCADO);
    }
  }

  btnR2M.addEventListener('click', () => setMode('r2m'));
  btnM2R.addEventListener('click', () => setMode('m2r'));
  amount.addEventListener('input', calc);
  currency.addEventListener('change', () => { updateLabel(); calc(); });

  setMode('r2m');
</script>

</body>
</html>
